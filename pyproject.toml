[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evm-bytecode-decompiler"
version = "0.1.0"
description = "AI-assisted semantic decompiler for EVM bytecode, powered by Gigahorse."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "EVM Bytecode Decompiler contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
]

[project.scripts]
evm-bytecode-decompiler = "evm_bytecode_decompiler.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evm_bytecode_decompiler", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gigahorse: requires a configured Gigahorse installation"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
